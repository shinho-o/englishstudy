<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내신 빈칸 7일</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* VOICE: 시험 직전 단어장처럼 단단하고 짧게. 응원보다 숫자.
   IDEA: 형광펜 칠한 내신 워크북 + 7칸 출석 도장판
   PICTURE: 오늘 미션 카드와 7일 도장 줄, 풀이 화면은 빈칸 문장 자체
   COLOUR and TYPE: 워크북 초록 #0d6b4a, 흰 종이, 형광 노랑 #ffe14d 강조 / Noto Sans KR + Source Serif 4(영문)
   LAYOUT: 한 열, 폰 우선, 최대 760px */
:root{color-scheme:light dark;--bg:light-dark(#f6f7f4,#0f1714);--paper:light-dark(#ffffff,#17221d);--ink:light-dark(#15201b,#e9efe9);--mute:light-dark(#5f6d66,#9fb0a7);--line:light-dark(#dde3de,#2a3832);--g:light-dark(#0d6b4a,#3fbf8a);--gd:light-dark(#0a4f37,#2b8f66);--hi:#ffe14d;--bad:light-dark(#c2362b,#ff7b6e);--badbg:light-dark(#fdecea,#3a1d1a);--okbg:light-dark(#e6f4ec,#163a2a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans KR",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
header{background:var(--g);color:#fff;padding:22px 0 26px}
header .wrap{padding-bottom:0}
h1{font-size:clamp(26px,6vw,36px);line-height:1.1;margin:0 0 6px;font-weight:900;letter-spacing:-.02em}
h1 mark{background:linear-gradient(transparent 55%,var(--hi) 55%);color:inherit;padding:0 2px}
header p{margin:0;opacity:.9;font-size:14px}
.namebox{display:flex;gap:8px;align-items:center;margin-top:14px;font-size:14px}
.namebox input{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;padding:8px 12px;font:inherit;font-size:16px;width:150px}
.namebox input::placeholder{color:rgba(255,255,255,.7)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:-14px 0 18px}
.day{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:8px 2px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--ink);min-height:74px}
.day b{display:block;font-size:15px}.day small{display:block;font-size:11px;color:var(--mute)}
.day .st{display:grid;place-items:center;width:26px;height:26px;margin:4px auto 0;border-radius:50%;border:2px dashed var(--line);font-size:14px;font-weight:700}
.day.done .st{background:var(--g);border:0;color:#fff}
.day.today{border:2px solid var(--g)}
.day.sel{box-shadow:0 0 0 3px var(--hi)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px}
.mission h2{font-size:22px;line-height:1.25;margin:4px 0 6px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--g);background:var(--okbg);border-radius:6px;padding:2px 8px}
.meta{color:var(--mute);font-size:14px;margin:0 0 16px}
.btn{appearance:none;border:0;border-radius:12px;background:var(--g);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:12px 18px;min-height:48px;cursor:pointer}
.btn:hover{background:var(--gd)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.wide{width:100%}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;margin:22px 0 12px;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;font:inherit;font-weight:700;color:var(--mute);padding:10px 12px;min-height:44px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ink);border-color:var(--g)}
.hidden{display:none!important}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.stat{background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.2}.stat small{color:var(--mute);font-size:12px}
/* practice */
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--g);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.ko{font-size:15px;color:var(--mute);margin:10px 0 14px;padding-left:10px;border-left:3px solid var(--hi)}
.en{font-family:"Source Serif 4",Georgia,serif;font-size:19px;line-height:2.15;word-break:keep-all}
.en input{font:600 17px "Source Serif 4",Georgia,serif;border:0;border-bottom:2px solid var(--g);background:light-dark(#f2f8f4,#1d2c25);color:var(--ink);padding:2px 6px;margin:0 2px;border-radius:6px 6px 0 0;text-align:center;max-width:100%}
.en input.ok{border-color:var(--g);background:var(--okbg)}
.en input.no{border-color:var(--bad);background:var(--badbg);color:var(--bad)}
.fix{display:inline-block;font:700 14px "Noto Sans KR",sans-serif;color:var(--g);background:var(--hi);color:#1a1a1a;border-radius:4px;padding:0 5px;margin-left:2px;line-height:1.5;vertical-align:middle}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{font:600 16px 'Source Serif 4',Georgia,serif;min-height:44px;padding:8px 14px;border-radius:22px;border:1.5px solid var(--g);background:var(--paper);color:var(--ink);cursor:pointer}.chip:disabled{opacity:.25;cursor:default}.en input.pick{cursor:pointer;caret-color:transparent}.en input.sel{outline:3px solid var(--hi)}
.msg{min-height:24px;font-size:14px;font-weight:700;margin:10px 0}.msg.no{color:var(--bad)}.msg.ok{color:var(--g)}
.sticky{position:sticky;bottom:0;background:var(--paper);padding:12px 0 4px;margin-top:8px;border-top:1px solid var(--line)}
/* lists */
.log{list-style:none;padding:0;margin:0}
.log li{padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li b{font-size:15px}.log .s{color:var(--mute)}
.pct{float:right;font-weight:700;font-size:16px}
textarea{width:100%;min-height:150px;font:14px/1.5 "Noto Sans KR",sans-serif;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--ink)}
select{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);min-height:44px;width:100%}
label.f{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.wrongs{font-size:14px;margin:8px 0 0;padding-left:18px}.wrongs li{margin:6px 0}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.confirm{display:inline-flex;gap:6px;align-items:center}
@media(max-width:480px){.day small{font-size:10px}.day b{font-size:13px}.en{font-size:18px}.stat b{font-size:20px}}
@media(prefers-reduced-motion:reduce){.bar i{transition:none}}
</style></head><body>
<header><div class="wrap">
<h1>내신 빈칸 <mark>7일</mark></h1>
<p>영어I 2과 · 영어II 3과 매일 같이 · 11/24(화) ~ 11/30(월)</p>
<div class="namebox"><label for="nm">이름</label><input id="nm" placeholder="이름 입력" autocomplete="off"><span id="pullst" style="font-size:13px;opacity:.9"></span></div>
</div></header>
<div class="wrap">
<div class="days" id="days"></div>

<section id="home">
<div class="card mission" id="mission"></div>
<div class="tabs" role="tablist"><button id="t-log" class="on">기록</button><button id="t-wrong">오답 문장</button><button id="t-free">자유 연습</button></div>
<div id="p-log"></div>
<div id="p-wrong" class="hidden"></div>
<div id="p-free" class="hidden card">
<label class="f" for="fr">범위</label><select id="fr"></select>
<label class="f" for="fm">방식</label><select id="fm"><option value="all">전체 문장</option><option value="wrong">이 범위의 오답만</option><option value="rand">랜덤 15문장</option></select>
<label class="f" for="fk">풀이</label><select id="fk"><option value="ch">선택형 (보기에서 고르기)</option><option value="ty">타이핑 (직접 쓰기)</option></select>
<div style="margin-top:14px"><button class="btn wide" id="fgo">연습 시작</button></div>
<p class="note">자유 연습도 기록에 남지만 그날 목표 완료로는 치지 않아요.</p>
</div>
</section>

<section id="play" class="hidden">
<div class="card">
<div class="qhead"><span id="qlab"></span><span id="qcnt"></span></div>
<div class="bar"><i id="qbar"></i></div>
<div class="ko" id="qko"></div>
<div class="en" id="qen"></div>
<div class="bank" id="bank"></div>
<div class="msg" id="qmsg"></div>
<div class="sticky row">
<button class="btn ghost" id="bhint">첫 글자 힌트</button>
<button class="btn" id="bgo" style="flex:1">확인</button>
</div>
<p class="note"><button class="btn ghost" id="bquit" style="min-height:40px;padding:6px 12px;font-size:14px">그만하기</button> <span id="qnote"></span></p>
</div>
</section>

<section id="done" class="hidden">
<div class="card">
<span class="tag" id="dtag"></span>
<h2 style="font-size:24px;margin:8px 0 2px" id="dtitle"></h2>
<div class="stats" id="dstats"></div>
<div id="dwrong"></div>
<p class="msg ok" id="sync"></p>
<details><summary class="note" style="cursor:pointer">카톡으로도 보내기 (선택)</summary>
<textarea id="rep" readonly></textarea>
<div class="row" style="margin-top:10px"><button class="btn ghost" id="bcopy" style="flex:1">기록 복사</button></div>
<p class="msg ok" id="cmsg"></p></details>
<button class="btn wide" id="bhome" style="margin-top:14px">처음으로</button>
</div>
</section>
</div>
<script>const DATA=[{"title":"영어I 2과","items":[{"sec":"교과서 본문","n":1,"ko":"Neil: 십 대를 위한 ‘10분 경제학 101’ 팟캐스트에 오신 것을 환영합니다! 저는 진행자 Neil입니다. 청취해 주셔서 감사합니다.","s":["Neil: Welcome to the 10-Minute Economics 101 podcast for ",{"a":"teenagers"},"! I’m your ",{"a":"host"},", Neil. Thank you for ",{"a":"tuning in"},"."]},{"sec":"교과서 본문","n":2,"ko":"이 자리에는 유명한 경제학자인 특별 손님 Beth Friedman과 함께합니다. 그녀를 따뜻하게 환영해 주세요!","s":["We have a very special guest with us, the ",{"a":"renowned"}," ","economist Beth Friedman. Please give her a warm ",{"a":"welcome"},"!"]},{"sec":"교과서 본문","n":3,"ko":"Beth: 안녕하세요. 여러분 모두와 함께하게 되어 정말 영광입니다.","s":["Beth: Hello, everyone. It’s truly an ",{"a":"honor"}," ","to be here with all of you."]},{"sec":"교과서 본문","n":4,"ko":"Neil: 우리는 경제학 기초들을 탐구하고 있습니다.","s":["Neil: We’ve been ",{"a":"exploring"}," ","the basics of economics."]},{"sec":"교과서 본문","n":5,"ko":"이번 35회 에피소드에서는 주식 세계에 관해 이야기할 거예요. 이제 시작하겠습니다.","s":["In this 35th episode, we’ll be talking about the world of ",{"a":"stocks"},". So let’s get ",{"a":"started"},"."]},{"sec":"교과서 본문","n":6,"ko":"Beth: 시작하기 전에, Neil, 당신에게 질문이 하나 있어요.","s":["Beth: Before we ",{"a":"begin"},", Neil, I have a question for you."]},{"sec":"교과서 본문","n":7,"ko":"당신은 여분의 돈으로 무엇을 할 것인지 궁금해 본 적이 있나요?","s":["Have you ever ",{"a":"wondered"}," ","what to do with your extra money?"]},{"sec":"교과서 본문","n":8,"ko":"Neil: 물론이죠, Beth. 저는 모든 청취자가 같은 질문을 자신에게 해 본 적이 있다고 확신합니다.","s":["Neil: ",{"a":"Absolutely"},", Beth. I ",{"a":"bet"}," ","all our listeners have asked themselves the same question."]},{"sec":"교과서 본문","n":9,"ko":"Beth: 정말 그렇죠. 그건 종종 특히 금융의 세계를 탐색하기 시작하는 젊은이들 사이에서 제기되는 질문입니다.","s":["Beth: Indeed. It’s a question that often ",{"a":"arises"},", especially among young people who are beginning to ",{"a":"explore"}," ","the world of ",{"a":"finance"},"."]},{"sec":"교과서 본문","n":10,"ko":"일상생활을 하면서, 여러분은 물건을 구매하고 버스 요금을 지불하는 등 금융 활동에 참여하는 자신을 발견하게 됩니다.","s":["As you go about your daily lives, you find yourself ",{"a":"engaged in"}," ","financial activities such as ",{"a":"purchasing"}," ","goods and paying bus ",{"a":"fares"},"."]},{"sec":"교과서 본문","n":11,"ko":"그 후에 당신은 약간의 여분의 돈이 있을 수 있어요.","s":["After that, you might have some ",{"a":"extra"}," ","money."]},{"sec":"교과서 본문","n":12,"ko":"Neil: 맞습니다. 어떤 사람들은 그 돈을 은행에 저금할 수 있고, 다른 사람들은 즉시 사용하기 위해 자기 지갑에 보관하는 것을 선호할 수 있습니다.","s":["Neil: You’re right. Some people might ",{"a":"save"}," ","it in the bank, and others might prefer keeping it in their wallets for ",{"a":"immediate"}," ","use."]},{"sec":"교과서 본문","n":13,"ko":"또한 이미 주식 거래를 시도해 본 사람들도 좀 있지요.","s":["There are also a few who have already been ",{"a":"venturing into"}," ","stock ",{"a":"trading"},"."]},{"sec":"교과서 본문","n":14,"ko":"오늘, 우리는 여러분에게 주식과 주식 시장에 대한 개요를 제공하여 경제에 대한 통찰력을 얻을 수 있도록 할 것입니다.","s":["Today, we’re going to provide you with an ",{"a":"overview"}," ","of stocks and stock markets, ",{"a":"enabling"}," ","you to gain ",{"a":"insight"}," ","into the ",{"a":"economy"},"."]},{"sec":"교과서 본문","n":15,"ko":"주식의 개념Beth: 자, 주식의 개념으로 시작해 볼까요.","s":["THE CONCEPT OF A STOCK Beth: Okay, let’s start with the ",{"a":"concept"}," ","of a stock."]},{"sec":"교과서 본문","n":16,"ko":"주식은 한 회사 소유권의 일부 지분입니다.","s":["A stock is a partial ",{"a":"share"}," ","of ",{"a":"ownership"}," ","in a company."]},{"sec":"교과서 본문","n":17,"ko":"여러분이 주식을 살 때, 여러분은 그 회사 소유권의 일부분을 갖게 됩니다.","s":["When you buy a stock, you get a ",{"a":"portion"}," ","of the company’s ownership."]},{"sec":"교과서 본문","n":18,"ko":"간단히 말하면 주식 한 주를 소유하는 것은 그 회사의 파이 한 조각을 가지는 셈이에요.","s":[{"a":"To put it simply"},", owning one stock is like having a slice of the company’s pie."]},{"sec":"교과서 본문","n":19,"ko":"Neil: 그것은 주주 자신들이 회사 경영에 적극적으로 참여할 수 있는 것을 의미하나요?","s":["Neil: Does that mean ",{"a":"stockholders"}," ","themselves can actively ",{"a":"participate in"}," ","the management of the company?"]},{"sec":"교과서 본문","n":20,"ko":"Beth: 정확히는 아니에요, Neil. 경영은 일반적으로 전문 경영인들에 의해 수행됩니다.","s":["Beth: Not exactly, Neil. ",{"a":"Management"}," ","is generally ",{"a":"carried out"}," ","by ",{"a":"professional"},{"a":"managers"},"."]},{"sec":"교과서 본문","n":21,"ko":"하지만, 회사는 중요한 결정을 할 때, 대주주들의 의견들을 구하기 위해 주주 총회를 개최합니다.","s":["However, companies hold stockholder meetings to seek the ",{"a":"opinions"}," ","of major stockholders when they make important decisions."]},{"sec":"교과서 본문","n":22,"ko":"주식 시장과 회사들Neil: 그렇군요. 그러면 회사는 주식 시장을 어떻게 활용하나요?","s":["THE STOCK MARKET AND COMPANIES Neil: I see. Then how do ",{"a":"companies"}," ","use the stock market?"]},{"sec":"교과서 본문","n":23,"ko":"Beth: 주식 시장은 회사가 성장하고 확장하는 데 필요한 자금을 제공할 수 있어서 회사에 매우 중요합니다.","s":["Beth: The stock market is very important for companies because it can ",{"a":"provide"}," ","them with the money they need to grow and ",{"a":"expand"},"."]},{"sec":"교과서 본문","n":24,"ko":"Neil: 그것이 어떻게 작동하는지요?","s":["Neil: How does that ",{"a":"work"},"?"]},{"sec":"교과서 본문","n":25,"ko":"Beth: 한 작은 집단의 사람들이 혁신적인 운동화를 생산하는 신발 회사를 시작한다고 상상해 보죠.","s":["Beth: Let’s imagine that a small group of people start a ",{"a":"footwear"}," ","company producing ",{"a":"innovative"},{"a":"sneakers"},"."]},{"sec":"교과서 본문","n":26,"ko":"창업자들은 그들의 제품이 소비자에게 인기 있을 것이라고 자신합니다만, 사업을 성장시킬 충분한 자금을 갖고 있지 않습니다.","s":["The ",{"a":"founders"}," ","are ",{"a":"confident"}," ","that their products will be popular with consumers, but they do not have enough ",{"a":"funds"}," ","to grow the business."]},{"sec":"교과서 본문","n":27,"ko":"그래서, 그들은 새로 설립된 회사를 주식 시장에 올리기로 합니다.","s":["So they decide to put the newly ",{"a":"formed"}," ","company on the stock market."]},{"sec":"교과서 본문","n":28,"ko":"Neil: 그러면 어떤 일이 발생하나요?","s":["Neil: What ",{"a":"happens"}," ","then?"]},{"sec":"교과서 본문","n":29,"ko":"Beth: 회사가 주식 시장에 상장되면, 그 회사의 밝은 미래를 믿는 개인이나 기관이 주식을 사서 그 회사의 부분적인 소유자가 될 수 있습니다.","s":["Beth: When a company is ",{"a":"listed"}," ","on the stock market, individuals or ",{"a":"organizations"}," ","that believe in the company’s bright future can buy shares and become ",{"a":"partial"}," ","owners of the company."]},{"sec":"교과서 본문","n":30,"ko":"이러한 과정이 그 신발 회사가 자신의 사업을 성장시키는 데 필요한 자금을 모으는 것을 쉽게 만들어 줍니다.","s":["This ",{"a":"process"}," ","makes it easy for the footwear company to ",{"a":"raise"}," ","the funds it needs to grow its business."]},{"sec":"교과서 본문","n":31,"ko":"사업이 성장함에 따라, 주식의 가치가 상승하고, 주주의 수익도 증가하게 되죠.","s":["As the business grows, the stock ",{"a":"value"}," ","rises, and the stockholders’ ",{"a":"profits"}," ","increase."]},{"sec":"교과서 본문","n":32,"ko":"주식 가격Neil: 그러면 어떤 요인들이 주식 가격에 영향을 미치나요?","s":["THE PRICES OF STOCKS Neil: Then what ",{"a":"factors"}," ","affect the prices of stocks?"]},{"sec":"교과서 본문","n":33,"ko":"Beth: 다른 거래와 마찬가지로, 주식 가격은 공급과 수요의 법칙에 따라 결정됩니다.","s":["Beth: Just like other ",{"a":"transactions"},", the prices of stocks are decided by the law of ",{"a":"supply"}," ","and ",{"a":"demand"},"."]},{"sec":"교과서 본문","n":34,"ko":"다시 말해, 사업이 성공할수록, 더 많은 사람이 그 회사의 잠재적 가치를 보고 주식을 사기 시작할 것입니다.","s":[{"a":"In other words"},", the more successful a business is, the more people will see the ",{"a":"potential"},{"a":"value"}," ","of the company and start buying its stocks."]},{"sec":"교과서 본문","n":35,"ko":"주식에 대한 수요가 증가함에 따라, 주가도 오르게 됩니다.","s":["As demand for the stocks ",{"a":"increases"},", so does the stock price."]},{"sec":"교과서 본문","n":36,"ko":"반대로, 만약 회사가 실망스럽게 성과를 내면, 주가도 하락할 것입니다.","s":["In contrast, if a company ",{"a":"performs"},{"a":"disappointingly"},", its stock price will fall."]},{"sec":"교과서 본문","n":37,"ko":"Neil: 이해했습니다. 가격에 영향을 미치는 다른 요인들이 있나요?","s":["Neil: Understood. Are there any other factors ",{"a":"affecting"}," ","the price?"]},{"sec":"교과서 본문","n":38,"ko":"Beth: 있습니다. 회사들은 원자재 가격, 생산 기술의 발전 및 인건비와 같은 시장 요인들의 영향을 지속해서 받고 있습니다.","s":["Beth: Yes, companies are ",{"a":"constantly"}," ","under the ",{"a":"influence"}," ","of market factors such as ",{"a":"raw material"}," ","prices, ",{"a":"advances"}," ","in production technology, and ",{"a":"labor costs"},"."]},{"sec":"교과서 본문","n":39,"ko":"Beth: 예를 들어, 원자재 가격 면에서, 고무 가격이 오르면, 신발 회사는 운동화를 제조하기 위해 해외로부터 필요한 고무를 수입하는데 더 큰 비용을 내야 할 수 있어요.","s":["Beth: For example, ",{"a":"in terms of"}," ","raw material prices, if the price of ",{"a":"rubber"}," ","rises, a shoe company may have to pay more to ",{"a":"import"}," ","the ",{"a":"rubber"}," ","it needs from abroad to ",{"a":"manufacture"}," ","sneakers."]},{"sec":"교과서 본문","n":40,"ko":"이것은, 차례로 생산 비용에 영향을 미치고 소비자 시장에서의 가격 상승으로 이어집니다.","s":["This, ",{"a":"in turn"},", affects production costs and ",{"a":"leads to"}," ","higher prices in the consumer market."]},{"sec":"교과서 본문","n":41,"ko":"소비자들이 그 회사의 운동화를 구매하는 것을 주저함에 따라, 회사는 실적 부진에 시달리게 되고, 주식 가격의 하락으로 이어질 수 있습니다.","s":["As consumers ",{"a":"hesitate"}," ","to purchase the company’s sneakers, the company may suffer from poor performance, leading to a ",{"a":"decline"}," ","in the stock price."]},{"sec":"교과서 본문","n":42,"ko":"Neil: 고려해야 할 것들이 참 많군요!","s":["Neil: There are so many things to ",{"a":"consider"},"!"]},{"sec":"교과서 본문","n":43,"ko":"Beth: 게다가, 투자자들은 회사의 리더십이나 평판에 대해 우려할 수 있습니다.","s":["Beth: ",{"a":"Additionally"},", investors may be ",{"a":"concerned"}," ","about a company’s leadership or ",{"a":"reputation"},"."]},{"sec":"교과서 본문","n":44,"ko":"요즘에는, 점점 더 많은 사람들이 비즈니스 투명성, 환경 친화성 및 사회 정의와 같은 공공 가치를 우선시하는 회사들을 지원하기 시작하고 있습니다.","s":[{"a":"Nowadays"},", more and more people are starting to support companies that ",{"a":"prioritize"}," ","public values such as business ",{"a":"transparency"},", environmental ",{"a":"friendliness"},", and social ",{"a":"justice"},"."]},{"sec":"교과서 본문","n":45,"ko":"그러한 주식들을 매수하면서, 그들은 자신의 재정적 목표를 추구할 뿐 아니라 사회 전체에 이익이 되는 더 지속 가능한 경제 체제를 구축하는데 기여합니다.","s":["In purchasing such stocks, they not only ",{"a":"pursue"}," ","their financial goals but also ",{"a":"contribute to"}," ","building a more ",{"a":"sustainable"}," ","economic system that ",{"a":"benefits"}," ","the entire society."]},{"sec":"교과서 본문","n":46,"ko":"이러한 모든 변수들이 주식 시장에서 주가의 일일 변동을 일으킬 수 있습니다.","s":["All these ",{"a":"variables"}," ","can ",{"a":"cause"}," ","daily changes in stock prices in the stock market."]},{"sec":"교과서 본문","n":47,"ko":"주식 시장에 투자하는 방법Neil: 우리가 주식에 대해 배울수록 더 어려워지는 것 같습니다. 그러면 우리는 주식 시장에 어떻게 투자해야 하나요?","s":["HOW TO INVEST IN THE STOCK MARKET Neil: It ",{"a":"seems"}," ","to get more difficult as we learn more about stocks. So how do we ",{"a":"invest"}," ","in the stock market?"]},{"sec":"교과서 본문","n":48,"ko":"Beth: 여러분은 주식 거래소, 또는 주식 시장이라고 불리는 공식 장소를 통해 주식을 살 수 있는데, 거기에서 회사의 주식을 쉽게 사고팔 수 있습니다.","s":["Beth: You can buy stocks through an ",{"a":"official"}," ","place called a ",{"a":"stock exchange"},", or stock market, where you can easily buy or sell stocks in a company."]},{"sec":"교과서 본문","n":49,"ko":"여러분은 주식에 대한 투자가 수익을 만드는 쉬운 방법이라고 생각할지 모릅니다.","s":["You might think investing in stocks is an easy way to make a ",{"a":"profit"},"."]},{"sec":"교과서 본문","n":50,"ko":"그러나, 여러분이 투자한다면, 돈을 잃을 준비도 되어 있어야 하죠.","s":["But if you are investing, you must be ",{"a":"prepared"}," ","to lose money."]},{"sec":"교과서 본문","n":51,"ko":"시장은 끊임없이 변동하기 때문에, 손실과 부채의 위험이 있습니다.","s":["Since the market constantly ",{"a":"fluctuates"},", there is a ",{"a":"risk"}," ","of loss and ",{"a":"debt"},"."]},{"sec":"교과서 본문","n":52,"ko":"Neil: 주식 투자는 도전적이네요! 그렇지만 틀림없이 저희 청취자들이 최고의 투자 선택에 대해 궁금할 것 같습니다.","s":["Neil: Investing in stocks is ",{"a":"challenging"},"! I bet our listeners are ",{"a":"curious"}," ","about the best investment ",{"a":"options"}," ","though."]},{"sec":"교과서 본문","n":53,"ko":"Beth: 그것은 개인 상황에 달려있어요.","s":["Beth: That depends on individual ",{"a":"circumstances"},"."]},{"sec":"교과서 본문","n":54,"ko":"일반적으로, 여러분이 정말 관심이 있는 몇몇 제품들 뒤에 있는 회사와 같은, 여러분의 관심을 끄는 그 무엇에 투자하는 것이 현명할 거예요.","s":[{"a":"Generally"},", it would be smart to invest in something that ",{"a":"interests"}," ","you, such as a company behind some products you ",{"a":"are into"},"."]},{"sec":"교과서 본문","n":55,"ko":"항상 조사하는 것을 잊지 말고, 투자하는 회사에 대한 정보를 얻고, 여러분의 투자 위험 허용 범위를 염두에 두세요.","s":["Always remember to do your research, stay informed about the companies you invest in, and be ",{"a":"mindful"}," ","of your ",{"a":"risk tolerance"},"."]},{"sec":"교과서 본문","n":56,"ko":"Neil: 투자는 부를 쌓는 강력한 도구가 될 수 있지만, 지식과 신중함을 가지고 접근하는 것이 필수적입니다.","s":["Neil: Investing can be a powerful tool for building wealth, but it’s essential to ",{"a":"approach"}," ","it with ",{"a":"knowledge"}," ","and ",{"a":"caution"},"."]},{"sec":"교과서 본문","n":57,"ko":"Beth: 현명한 말씀이네요, Neil.Neil: 좋아요. 오늘 방송분이 여러분에게 도움이 되었기를 바랍니다!","s":["Beth: Wise words, Neil. Neil: All right. I hope today’s episode was ",{"a":"helpful"}," ","for you!"]},{"sec":"교과서 본문","n":58,"ko":"다음 시간에는 또 다른 흥미로운 주제로 돌아올 테니, ‘10분 경제학 101’을 다시 청취해 주시기를 바랍니다!","s":["I’ll be back with another exciting ",{"a":"topic"}," ","next time, so make sure to tune in to 10-Minute Economics 101 again!"]},{"sec":"교과서 본문","n":59,"ko":"여러분에게 이 방송이 도움이 되었으면, 경제학에 대해 더 배우는 데 관심이 있을 친구들과 공유해 주세요!","s":["If you found this episode helpful, please ",{"a":"share"}," ","it with any friends who might be ",{"a":"interested"}," ","in learning more about economics!"]},{"sec":"본문 외 지문","n":1,"ko":"주식 시장의 움직임은 강세장과 약세장의 두 가지 주요 추세로 구분될 수 있다.","s":["Stock market movement can be ",{"a":"divided into"}," ","two ",{"a":"major"}," ","trends: ",{"a":"bull market"}," ","vs. ",{"a":"bear market"},"."]},{"sec":"본문 외 지문","n":2,"ko":"강세장 강세장은 경제적인 조건이 투자자에게 유리한 상승하는 주식 시장 상황이다.","s":["BULL MARKET A bull market is a rising stock market situation in which economic ",{"a":"conditions"}," ","are ",{"a":"favorable"}," ","to investors."]},{"sec":"본문 외 지문","n":3,"ko":"그것은 높은 고용률, 국내 총생산 증가, 기타 긍정적 경제 지표들을 포함한다.","s":["They include high ",{"a":"employment rates"},", ",{"a":"GDP"}," ","increases, and other positive economic ",{"a":"indicators"},"."]},{"sec":"본문 외 지문","n":4,"ko":"머리 뿔을 들어 올리고 들판에서 돌진하는 황소를 생각해 보라.","s":["Think of a ",{"a":"charging"},{"a":"bull"}," ","in a field raising its ",{"a":"horns"},"."]},{"sec":"본문 외 지문","n":5,"ko":"상승장에서, 투자자들은 흔히 시장의 현재와 미래 성과에 대해 믿는다.","s":["In a bull market, investors often believe in the market’s present and future ",{"a":"performance"},"."]},{"sec":"본문 외 지문","n":6,"ko":"그렇기 때문에 그들은 주식 매입을 늘리고 투자를 유지한다.","s":[{"a":"As such"},", they increase their stock purchases and ",{"a":"maintain"}," ","their investments."]},{"sec":"본문 외 지문","n":7,"ko":"약세장 자신의 앞다리를 내린 채 서 있는 곰처럼, 하락장은 주식 가치의 하락을 암시한다.","s":["BEAR MARKET Like a standing ",{"a":"bear"}," ","having ",{"a":"lowered"}," ","its front legs, a bear market ",{"a":"implies"}," ","a decline in stock values."]},{"sec":"본문 외 지문","n":8,"ko":"그것은 경제적 조건들이 호의적이지 않을 때 발생하며, 주식 대부분이 가치 하락을 겪는다.","s":["It ",{"a":"occurs"}," ","when economic conditions are not favorable, and most stocks experience decreases in value."]},{"sec":"본문 외 지문","n":9,"ko":"낮은 국내 총생산 성장률, 실업 증가 및 저임금과 같은 요인들이 약세장의 가능한 조건들이다.","s":["Factors like low GDP growth, rising ",{"a":"unemployment"},", and low ",{"a":"wages"}," ","are possible conditions for a bear market."]},{"sec":"본문 외 지문","n":10,"ko":"어려운 경제 상황에서, 투자자들은 자주 주식 시장에 대해 부정적인 견해를 가지며, 그것이 그들의 주식을 매도하게 이끈다.","s":["In difficult economic situations, investors ",{"a":"frequently"}," ","have ",{"a":"negative"},{"a":"views"}," ","of the stock market, which may lead them to sell their stocks."]}]},{"title":"영어II 3과","items":[{"sec":"교과서 본문","n":1,"ko":"바이러스는 오로지 인류에게 고통을 주기 위해 존재하는 것으로 보인다.","s":["It appears that viruses exist ",{"a":"solely"}," ","to bring suffering to ",{"a":"humanity"},"."]},{"sec":"교과서 본문","n":2,"ko":"1918년 인플루엔자 대유행은 5천만 명에서 1억 명의 목숨을 빼앗아 간 것으로 추정된다.","s":["The 1918 influenza ",{"a":"pandemic"}," ","is ",{"a":"estimated"}," ","to have killed 50 to 100 million people."]},{"sec":"교과서 본문","n":3,"ko":"추정에 따르면, 천연두는 20세기에만 추가로 2억 명의 목숨을 앗아갔다.","s":[{"a":"Smallpox"},{"a":"claimed"}," ","the lives of a further 200 million people in the 20th century ",{"a":"alone"},", according to ",{"a":"estimates"},"."]},{"sec":"교과서 본문","n":4,"ko":"그리고 물론 최근의 코로나19 팬데믹은 수백만 명의 목숨을 앗아갔으며, 전 세계적으로 인간 삶의 거의 모든 측면에 영향을 미치고 있다.","s":["And of course, the recent COVID-19 pandemic has taken several million lives, affecting almost every ",{"a":"aspect"}," ","of human life ",{"a":"worldwide"},"."]},{"sec":"교과서 본문","n":5,"ko":"바이러스성 질병의 발생은 박쥐와 같은 야생 동물과의 접촉과 관련이 있는 경우가 많다.","s":[{"a":"Outbreaks"}," ","of ",{"a":"viral"}," ","diseases ",{"a":"are"}," ","frequently ",{"a":"linked to"}," ","contact with wild animals such as bats."]},{"sec":"교과서 본문","n":6,"ko":"이러한 접촉을 통해 새로운 바이러스가 그러한 바이러스에 대한 기존 면역력이 없는 사람의 몸에 침투할 수 있다.","s":["Such ",{"a":"contacts"}," ","allow new viruses to enter human bodies that have no ",{"a":"prior"},{"a":"immunity"}," ","to such viruses."]},{"sec":"교과서 본문","n":7,"ko":"역사적으로 산과 숲과 같은 자연 장벽은 동물 바이러스가 인간을 감염시키는 것을 막았다.","s":["Historically, natural ",{"a":"barriers"}," ","such as mountains and forests ",{"a":"prevented"}," ","animal viruses ",{"a":"from"}," ","infecting humans."]},{"sec":"교과서 본문","n":8,"ko":"산업화는 이러한 장벽을 파괴시켜왔고 기후 변화로 인해 일부 야생 동물들이 원래 서식지에서 밀려났다.","s":[{"a":"Industrialization"}," ","has ",{"a":"destroyed"}," ","these barriers, and climate change has pushed some wild animals out of their ",{"a":"original"},{"a":"habitats"},"."]},{"sec":"교과서 본문","n":9,"ko":"이러한 변화로 인해 인간과 야생 동물 간의 상호 작용이 증가했고, 이는 야생 동물에 존재하는 바이러스가 인간에게 전파될 기회가 더 많아졌다는 것을 의미한다.","s":["These changes have resulted in an increase in ",{"a":"interactions"}," ","between human and wild animals, meaning more opportunities for the viruses ",{"a":"present"}," ","in wild animals to ",{"a":"spread"}," ","to humans."]},{"sec":"교과서 본문","n":10,"ko":"이것이 과학자들이 앞으로 팬데믹이 증가할 수 있다고 우려하는 주된 이유이다. 그렇다면 바이러스는 정말 인간에게 해로운 존재일까? 반드시 그렇지는 않다.","s":["This is the ",{"a":"primary"}," ","reason for scientists’ ",{"a":"concern"}," ","that pandemics may increase in the future. Then, is the virus truly a harmful ",{"a":"presence"}," ","to humans? Not necessarily."]},{"sec":"교과서 본문","n":11,"ko":"지구의 수호자덜 일반적으로 알려진 것은 바이러스가 지구상의 많은 생명체를 지탱하는 데 중요한 역할을 한다는 것이다.","s":["Keepers of the Earth What is less ",{"a":"commonly"}," ","known is that viruses ",{"a":"play"},{"a":"crucial"},{"a":"roles in"},{"a":"supporting"}," ","much of life on Earth."]},{"sec":"교과서 본문","n":12,"ko":"이는 연구자들이 인간에게 해를 끼치는 바이러스 대신에 인간과 지구를 지탱하는 바이러스에 대한 연구를 최근에야 시작했기 때문이다.","s":["This is because researchers have only recently begun ",{"a":"investigating"}," ","the viruses that ",{"a":"sustain"}," ","us and the planet, instead of just those that harm us."]},{"sec":"교과서 본문","n":13,"ko":"따라서 과학자들은 바이러스에 대해 현재 알고 있는 것보다 배울 것이 훨씬 더 많다.","s":["Therefore, scientists have much more to learn about viruses than they ",{"a":"currently"}," ","know."]},{"sec":"교과서 본문","n":14,"ko":"그들이 알고 있는 것은 바이러스가 박테리아와 곤충 개체군의 주요 조절자 역할을 한다는 것이다.","s":["What they do know is that viruses act as the primary ",{"a":"regulators"}," ","of bacterial and insect ",{"a":"populations"},"."]},{"sec":"교과서 본문","n":15,"ko":"바이러스는 자체의 생식 기능이 없기 때문에 증식하기 위해 다른 유기체의 생식 기능을 훔친다. 일부 유형의 바이러스는 박테리아를 사용한다.","s":["Since viruses do not have ",{"a":"reproductive"},{"a":"functions"},{"a":"on their own"},", they steal the ",{"a":"reproductive"},{"a":"functions"}," ","of other ",{"a":"organisms"}," ","to multiply. Some types of viruses use bacteria."]},{"sec":"교과서 본문","n":16,"ko":"바이러스가 박테리아 내에서 계속 증식하면 박테리아는 결국 죽고 새로 생성된 바이러스가 다른 박테리아를 감염시킨다.","s":["When the virus continues to ",{"a":"multiply"}," ","inside the bacteria, the bacteria ",{"a":"eventually"}," ","die, and the newly produced viruses go on to ",{"a":"infect"}," ","other bacteria."]},{"sec":"교과서 본문","n":17,"ko":"이 전체 과정은 바이러스가 특정 박테리아의 과도한 성장을 제어하는 데 도움이 된다.","s":["This whole process helps viruses control the ",{"a":"excessive"}," ","growth of certain bacteria."]},{"sec":"교과서 본문","n":18,"ko":"박테리아를 감염시키는 바이러스가 갖는 더 중요한 의미는 그것들이 지구에 산소를 공급하는 데 필수적인 역할을 한다는 것이다.","s":["The greater ",{"a":"significance"}," ","of viruses infecting bacteria is that they play a ",{"a":"vital"}," ","role in supplying ",{"a":"oxygen"}," ","to our planet."]},{"sec":"교과서 본문","n":19,"ko":"지구에 있는 산소의 약 절반은 바다의 플랑크톤이 생산하며, 이 플랑크톤의 주요 먹이는 바이러스 감염으로 죽은 박테리아에서 방출되는 영양소이다.","s":["About half of the oxygen on Earth is produced by plankton in the oceans, and the primary food source for these plankton is ",{"a":"nutrients"},{"a":"released"}," ","from bacteria killed by viral ",{"a":"infections"},"."]},{"sec":"교과서 본문","n":20,"ko":"바이러스가 박테리아를 감염시켜 죽이지 않는다면 박테리아의 사체도 없을 것이고, 그 결과 플랑크톤이 부족해질 것이다. 플랑크톤이 없다면 지구 산소의 절반이 사라질 것이다.","s":["If viruses did not infect and kill bacteria, there would be no bacterial ",{"a":"remains"},", ",{"a":"leading to"}," ","a lack of plankton. Without plankton, half of Earth’s oxygen would ",{"a":"disappear"},"."]},{"sec":"교과서 본문","n":21,"ko":"요약하자면, 바이러스가 없다면 산소가 부족해져 인류의 생존이 불가능할 것이다. 곤충 종의 개체 수 역시 바이러스에 의해 조절된다.","s":[{"a":"In short"},", without viruses, the lack of oxygen would make it impossible for humans to survive. Insect ",{"a":"species"}," ","populations are also ",{"a":"regulated"}," ","by viruses."]},{"sec":"교과서 본문","n":22,"ko":"특정 유형의 곤충이 과도하게 증가하면 해당 곤충을 감염시키는 바이러스도 증가하여 그 곤충의 수가 감소한다. 이는 결국 다른 종류의 곤충이 번성할 수 있는 여지를 만들어 준다.","s":["When a ",{"a":"specific"}," ","type of insect increases excessively, the viruses that infect those insects also increase, reducing their numbers. This, ",{"a":"in turn"},", creates room for other types of insects to ",{"a":"flourish"},"."]},{"sec":"교과서 본문","n":23,"ko":"자연의 먹이 사슬을 고려할 때, 바이러스가 다른 종을 조절하는 중요한 기능을 수행한다고 가정하는 것은 어렵지 않을 것이다. 우리는 생태계에서 바이러스가 수행하는 다양한 역할을 이제 막 이해하기 시작했다.","s":["Considering the chain of food in nature, it would not be difficult to ",{"a":"assume"}," ","that viruses ",{"a":"fulfill"}," ","important functions in regulating other species. We have just started to understand their various roles in the ",{"a":"ecosystem"},"."]},{"sec":"교과서 본문","n":24,"ko":"진화의 조력자바이러스의 또 다른 잘 알려지지 않은 역할은 지구 생명체의 진화에 대한 기여이다.","s":["Helpers of ",{"a":"Evolution"}," ","Another less recognized role of viruses is their ",{"a":"contribution"}," ","to the ",{"a":"evolution"}," ","of life on Earth."]},{"sec":"교과서 본문","n":25,"ko":"바이러스가 난자나 정자와 같은 숙주의 생식 세포를 감염시키면 바이러스의 DNA가 숙주의 자손에게 전달될 수 있다.","s":["When a virus infects a reproductive ",{"a":"cell"}," ","of its ",{"a":"host"},", such as an ",{"a":"egg"}," ","or ",{"a":"sperm"},", the viral DNA may be ",{"a":"passed down to"}," ","the ",{"a":"host"},"‘s ",{"a":"offspring"},"."]},{"sec":"교과서 본문","n":26,"ko":"새로운 DNA가 게놈에 삽입되는 것은 진화의 중요한 메커니즘이다.","s":["The ",{"a":"insertion"}," ","of new DNA into ",{"a":"genomes"}," ","is a ",{"a":"significant"}," ","mechanism of evolution."]},{"sec":"교과서 본문","n":27,"ko":"다시 말해, 바이러스가 없다면 지구상의 모든 생명체의 진화 잠재력이 영향을 받을 것이다.","s":["Without viruses, ",{"a":"in other words"},", the ",{"a":"evolutionary"},{"a":"potential"}," ","for all life on the planet would be ",{"a":"impacted"},"."]},{"sec":"교과서 본문","n":28,"ko":"바이러스가 진화에 기여한 한 가지 예는 포유류의 태반 발달에서 그것들의 역할이다.","s":["One example of viruses’ contributions to evolution is their role in the development of the ",{"a":"placenta"}," ","in ",{"a":"mammals"},"."]},{"sec":"교과서 본문","n":29,"ko":"태반은 태아가 엄마의 몸 안에서 안전하게 성장할 수 있도록 돕는 복잡한 기관이다.","s":["A placenta is a ",{"a":"complex"},{"a":"organ"}," ","that helps the ",{"a":"fetus"}," ","grow ",{"a":"securely"}," ","inside its mother’s body."]},{"sec":"교과서 본문","n":30,"ko":"그것은 산소, 영양분, 노폐물의 교환을 용이하게 하는 동시에 태아를 엄마의 면역 체계로부터 보호한다.","s":["It ",{"a":"facilitates"}," ","the ",{"a":"exchange"}," ","of oxygen, nutrients, and ",{"a":"waste products"}," ","while protecting the fetus from the mother’s ",{"a":"immune"}," ","system."]},{"sec":"교과서 본문","n":31,"ko":"진화 초기에 암컷 동물은 둥지에 놓인 알처럼 새끼를 한 곳에 놓아두어야 했기 때문에 포식자의 공격에 취약할 수밖에 없었다.","s":["In the early days of evolution, female animals had to leave their offspring in one ",{"a":"location"},", like eggs in a nest, making them ",{"a":"vulnerable"}," ","to ",{"a":"predators"},"."]},{"sec":"교과서 본문","n":32,"ko":"태반의 출현 이후 암컷은 새끼를 몸 안에 넣어 한 장소에서 다른 장소로 안전하게 옮길 수 있게 되었다.","s":["After the ",{"a":"emergence"}," ","of the placenta, females were able to carry their young inside their bodies safely from one location to another."]},{"sec":"교과서 본문","n":33,"ko":"1억 3천만 년 이상 전 인류의 먼 조상을 감염시킨 바이러스가 이 중요한 기관의 발달에 핵심적인 역할을 한 것으로 보고되었다.","s":["Viruses that infected our ",{"a":"remote"},{"a":"ancestors"}," ","more than 130 million years ago have been reported to have ",{"a":"served"}," ","a key function in the development of this vital organ."]},{"sec":"교과서 본문","n":34,"ko":"치료를 위한 수단바이러스에 대한 과학적 지식이 계속 확장됨에 따라 질병과의 전쟁에서 바이러스를 활용할 수 있는 새로운 기회가 생겨나고 있다.","s":["Means for Cures As scientific knowledge about viruses continues to ",{"a":"expand"},", new opportunities for ",{"a":"utilizing"}," ","them in the battle against diseases are arising."]},{"sec":"교과서 본문","n":35,"ko":"주목할 만한 관심사는 유전자 치료와 암 치료 분야이다. 유전자는 우리 몸이 기능하는 방식을 규정하는 지침서에 비유할 수 있다.","s":["Of ",{"a":"notable"}," ","interest are the areas of ",{"a":"gene"},{"a":"therapy"}," ","and ",{"a":"cancer"},{"a":"treatment"},". Genes can be ",{"a":"compared"}," ","to ",{"a":"instruction guides"}," ","that ",{"a":"govern"}," ","how our bodies function."]},{"sec":"교과서 본문","n":36,"ko":"때때로 사람들은 유전적 장애를 가지고 태어나며 이 장애가 건강에 문제를 일으킬 수 있다. 유전자 치료는 이러한 문제를 해결하기 위해 개입한다.","s":["Sometimes, people are born with ",{"a":"genetic"},{"a":"disorders"},", which can lead to health problems. Gene therapy ",{"a":"steps in"}," ","to ",{"a":"fix"}," ","these issues."]},{"sec":"교과서 본문","n":37,"ko":"유전자 치료의 핵심은 환자의 세포에 올바른 유전적 지침을 전달하여 세포가 제대로 기능할 수 있도록 하는 것에 있다.","s":["The ",{"a":"essence"}," ","of gene therapy ",{"a":"lies in"},{"a":"delivering"},{"a":"corrected"}," ","genetic instructions to a patient’s cells, enabling them to function ",{"a":"properly"},"."]},{"sec":"교과서 본문","n":38,"ko":"이 과정에서 특수하게 변형된 바이러스가 유전적 지시를 전달하는 매개체 중 하나로 사용된다.","s":["In this process, specially ",{"a":"modified"}," ","viruses are used as one of the ",{"a":"carriers"}," ","of the genetic instructions."]},{"sec":"교과서 본문","n":39,"ko":"환자의 세포가 제대로 기능하면 신체가 특정 질병을 퇴치하는 데 잠재적으로 도움이 될 수 있다.","s":["If the patient’s cells ",{"a":"function"}," ","properly, it can potentially help the body ",{"a":"fight off"}," ","certain diseases."]},{"sec":"교과서 본문","n":40,"ko":"바이러스를 이용한 암 치료는 바이러스의 또 다른 용도로서, 세포를 감염시키고 죽이는 바이러스의 자연적인 능력을 활용한다는 개념에 기반을 두고 있다.","s":["Using viruses to treat cancer, another use of viruses, is based on the ",{"a":"notion"}," ","of utilizing their natural ability to infect and kill cells."]},{"sec":"교과서 본문","n":41,"ko":"성공한다면, 건강한 세포는 손상시키지 않으면서 암세포만 명확히 표적으로 삼아 파괴하기 위해 바이러스는 조작될 수 있다.","s":["If successful, viruses can be ",{"a":"manipulated"}," ","to specifically target and destroy cancer cells while leaving healthy cells ",{"a":"unharmed"},"."]},{"sec":"교과서 본문","n":42,"ko":"유전자 치료와 암 치료에 바이러스를 사용하는 것은 아직 초기 단계에 머물러 있다.","s":["The use of viruses in gene therapy and cancer treatment is still in the early ",{"a":"stages"},"."]},{"sec":"교과서 본문","n":43,"ko":"그러나 많은 연구자들이 한때 불치병으로 여겨졌던 질병의 치료법을 발견하기 위해 수백 개의 프로젝트에 참여하고 있다.","s":["However, many researchers ",{"a":"are involved in"}," ","hundreds of projects with the goal of discovering ",{"a":"cures"}," ","for diseases that were once thought to be ",{"a":"incurable"},"."]},{"sec":"교과서 본문","n":44,"ko":"우리는 아직 각 바이러스의 특성은 물론이고 얼마나 많은 종류의 바이러스가 존재하는지조차 파악하지 못하고 있다.","s":["We ",{"a":"have yet to"}," ","find out how many virus types even exist, ",{"a":"let alone"}," ","the ",{"a":"characteristics"}," ","of each of them."]},{"sec":"교과서 본문","n":45,"ko":"하지만 바이러스에 대해 더 많이 알수록 특정 바이러스를 유익한 목적으로 사용하고 다음 팬데믹으로 이어질 수 있는 바이러스에 대한 방어책을 개발하는 데 더 잘 대비할 수 있을 것이다.","s":["The more we learn about viruses, however, the better ",{"a":"equipped"}," ","we will be to use certain viruses for ",{"a":"beneficial"}," ","purposes and to develop ",{"a":"defenses"}," ","against viruses that could lead to the next pandemic."]},{"sec":"교과서 본문","n":46,"ko":"뿐만 아니라, 바이러스 다양성에 대해 더 많이 알게 되는 것은 지구와 생태계, 우리 몸의 작용에 대해 더 깊이 이해할 수 있게 도움을 줄 것이다.","s":[{"a":"More than that"},", learning more about viral ",{"a":"diversity"}," ","will help us reach a deeper understanding of the ",{"a":"working"}," ","of our planet, ecosystems, and our own bodies."]},{"sec":"본문 외 지문","n":1,"ko":"1600년대 유럽에서 흑사병(페스트)이라는 치명적인 질병으로 많은 사람이 사망했을 때, 일부 의사들은 환자를 치료하기 위해 기묘한 의상을 입었다.","s":["When a ",{"a":"deadly"}," ","disease called the ",{"a":"plague"}," ","killed many people in Europe in the 1600s, some doctors wore a strange ",{"a":"costume"}," ","to ",{"a":"treat"}," ","the sick."]},{"sec":"본문 외 지문","n":2,"ko":"이 의상은 광택이 나는 긴 코트와, 하나로 연결된 바지와 부츠로 이루어졌다.","s":["The costume had a long coat with ",{"a":"polish"}," ","on it and pants and boots that were ",{"a":"attached"},"."]},{"sec":"본문 외 지문","n":3,"ko":"셔츠가 끝까지 채워졌고, 그들은 염소 가죽으로 만든 모자와 장갑을 착용했다.","s":["Their shirts were ",{"a":"fastened"},", and they wore hats and gloves made of goat ",{"a":"skin"},"."]},{"sec":"본문 외 지문","n":4,"ko":"의사들은 또한 아픈 사람들을 만지거나 밀쳐내는 데 사용하는 막대기를 가지고 있었다.","s":["The doctors also had a ",{"a":"stick"}," ","that they used to touch or ",{"a":"push away"}," ","the sick people."]},{"sec":"본문 외 지문","n":5,"ko":"의상에서 가장 특이한 부분은 마스크였다. 안경과 새 부리 같은 긴 코가 있었고 허브와 좋은 냄새가 나는 것들로 가득 차 있었다.","s":["The most ",{"a":"unusual"}," ","part of the costume was the mask: It had glasses and a long nose like a bird’s ",{"a":"beak"},", which was filled with herbs and other things that smelled good."]},{"sec":"본문 외 지문","n":6,"ko":"의사들은 흑사병이 몸의 내부 균형을 깨뜨릴 수 있는 나쁜 공기 때문에 발생한다고 생각했다.","s":["The doctors thought that the plague was caused by bad air that could ",{"a":"disrupt"}," ","the body’s ",{"a":"internal"}," ","balance."]},{"sec":"본문 외 지문","n":7,"ko":"그들은 마스크의 허브가 공기를 걸러내고 병에 걸리지 않도록 보호해 주기를 바랐다.","s":["They hoped that the herbs in the mask would ",{"a":"filter"}," ","the air and ",{"a":"protect"}," ","them from getting sick."]},{"sec":"본문 외 지문","n":8,"ko":"하지만 그들은 틀렸다. 흑사병은 동물에서 사람으로 퍼질 수 있는 박테리아에 의해 발생했다. 박테리아는 벼룩에 물리거나 아픈 사람과의 접촉을 통해서도 퍼질 수 있었다.","s":["But they were wrong. The plague was caused by bacteria that could ",{"a":"spread"}," ","from animals to people. The bacteria could also ",{"a":"spread"}," ","through ",{"a":"flea"},{"a":"bites"}," ","or contact with sick people."]},{"sec":"본문 외 지문","n":9,"ko":"의사들의 의복과 방법은 실제로 흑사병으로부터 그들을 보호하지 못했다. 그 이후 상황이 크게 바뀌었다.","s":["The doctors’ costume and ",{"a":"methods"}," ","did not really protect them from the plague. ",{"a":"Things"}," ","have greatly changed since then."]},{"sec":"본문 외 지문","n":10,"ko":"현대 의학 덕분에 우리는 박테리아와 바이러스를 신속하게 탐지하고 대응할 수 있게 되었다. 보호 장비는 바이러스 연구와 환자 치료 과정에서 우리를 보호해 준다.","s":["With modern medicine, we ",{"a":"detect"}," ","and ",{"a":"counter"}," ","bacteria and viruses ",{"a":"swiftly"},". ",{"a":"Protective"},{"a":"gear"}," ","protects us during virus research and patient ",{"a":"treatment"},"."]},{"sec":"본문 외 지문","n":11,"ko":"하지만 인류를 보호하기 위해 보이지 않는 적과 싸우는 용감한 의사와 과학자들에 대한 우리의 신뢰는 변하지 않았다.","s":["Yet, our ",{"a":"reliance"}," ","on brave doctors and scientists remains unchanged, as they ",{"a":"combat"}," ","unseen enemies to protect humanity."]}]}];</script>

 $('dwrong').innerHTML=wrong.length?`<h3 style="font-size:16px;margin:16px 0 4px">처음에 틀린 문장 ${wrong.length}개</h3><ul class="wrongs">${wrong.map(id=>`<li><b>${esc(lab(BY[id]))}</b> — ${esc(full_(BY[id]))}</li>`).join('')}</ul>`:'<p class="msg ok">처음부터 전부 맞혔어요.</p>';
 $('rep').value=report(log);$('cmsg').textContent='';show('done');S=null;refresh(true)}
const full_=i=>i.seg.map(x=>typeof x==='object'?`[${x.a}]`:x).join('');
function report(l){const d=new Date(l.at);return `[내신 빈칸 7일] ${ST.name||'(이름 없음)'}\n${md(d)} ${hm(d)} · ${l.title}\n${l.full?'완료':'중간에 그만둠'} · 첫 시도 ${l.ok}/${l.nb} (${l.pct}%) · ${l.min}분\n틀린 문장: ${l.wrong.length?l.wrong.map(id=>lab(BY[id])).join(', '):'없음'}\n7일 목표 달성: ${PLAN.map((p,k)=>dayDone(k)?'■':'□').join('')} (${PLAN.filter((p,k)=>dayDone(k)).length}/7)`}
function allReport(){return `[내신 빈칸 7일] ${ST.name||'(이름 없음)'} 전체 기록\n7일 목표 달성: ${PLAN.map((p,k)=>dayDone(k)?'■':'□').join('')} (${PLAN.filter((p,k)=>dayDone(k)).length}/7)\n`+ST.logs.map(l=>{const d=new Date(l.at);return `- ${md(d)} ${hm(d)} ${l.title} · ${l.pct}% · ${l.min}분${l.full?'':' · 중단'}`}).join('\n')+`\n현재 오답 문장 ${ITEMS.filter(i=>weak(i.id)).length}개`}
function copy(t,m){const done=()=>{m.textContent='복사했어요. 카톡에 붙여넣으세요.'};try{navigator.clipboard.writeText(t).then(done,()=>{m.textContent='복사가 막혔어요. 위 글을 길게 눌러 복사하세요.'})}catch(e){m.textContent='복사가 막혔어요. 위 글을 길게 눌러 복사하세요.'}}
$('bcopy').onclick=()=>{$('rep').select();copy($('rep').value,$('cmsg'))};
$('bhome').onclick=()=>{show('home');pull()};
$('nm').value=ST.name||'';$('nm').oninput=()=>{ST.name=$('nm').value.trim();save()};$('nm').onchange=()=>pull();
const LBL={};ITEMS.forEach(i=>LBL[lab(i)]=i.id);
async function pull(){const st=$('pullst');if(!SCRIPT_URL||!ST.name||S)return;st.textContent='기록 불러오는 중…';
 try{const r=await fetch(SCRIPT_URL+'?name='+encodeURIComponent(ST.name));const d=await r.json();if(S)return;
  const item={},logs=[];const ap=(id,good)=>{const t=item[id]||(item[id]={w:0,k:0});if(good)t.k++;else{t.w++;t.k=0}};
  (d.items||[]).forEach(([l,res])=>{const id=LBL[l];if(id)ap(id,res==='정답')});
  (d.sets||[]).forEach(r=>{const [at,day,title,status,ok,nb,pct,min,wrong,rem]=r;logs.push({rem:String(rem||'').split(', ').map(x=>LBL[x]).filter(Boolean),at:at||Date.now(),day:typeof day==='number'?day-1:-1,title:String(title),full:status==='완료',ok:+ok||0,nb:+nb||0,pct:+pct||0,min:+min||0,wrong:String(wrong||'').split(', ').map(x=>LBL[x]).filter(Boolean)})});
  Q.forEach(q=>{if(q.type==='item'&&q.attempt==='첫 시도'&&LBL[q.item])ap(LBL[q.item],q.result==='정답');if(q.type==='set')logs.push({rem:String(q.rem||'').split(', ').map(x=>LBL[x]).filter(Boolean),at:Date.now(),day:typeof q.day==='number'?q.day-1:-1,title:q.title,full:q.status==='완료',ok:q.ok,nb:q.nb,pct:q.pct,min:q.min,wrong:String(q.wrong||'').split(', ').map(x=>LBL[x]).filter(Boolean)})});
  logs.sort((a,b)=>a.at-b.at);ST.item=item;ST.logs=logs;save();st.textContent=`기록 불러옴 ✓ (${logs.length}회)`;refresh(true)}
 catch(e){st.textContent='기록을 못 불러왔어요 (이 기기 기록으로 진행)'}}
function refresh(keep){syncUI();renderDays();renderMission();renderLog();renderWrong();if(!keep)show('home')}
freeOpts();refresh();flush();pull();
}
</script></body></html>
